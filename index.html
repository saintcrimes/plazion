<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f2" />
    <meta name="description" content="PLazion — интеллектуальная плазменная очистка воздуха для промышленности и коммерческих пространств." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>PLazion — Чистый воздух. Новая энергия.</title>
    <script>
      // Apply saved preferences before rendering to prevent a theme flash.
      try {
        const theme = localStorage.getItem('plazion-theme');
        document.documentElement.dataset.theme = theme === 'dark' || theme === 'light'
          ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const language = localStorage.getItem('plazion-language');
        if (['ru', 'en', 'uz'].includes(language)) document.documentElement.lang = language;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
